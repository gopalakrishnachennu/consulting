{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-3xl py-10">
    <div class="rounded-[28px] border border-slate-200 bg-white p-8 shadow-sm">
        <div class="mb-8">
            <div class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">{{ content.employee_onboarding_title }}</div>
            <h1 class="mt-3 text-3xl font-semibold text-slate-950">Set your employee workspace.</h1>
            <p class="mt-3 text-sm leading-6 text-slate-600">{{ content.employee_onboarding_body }}</p>
        </div>
        <form method="post" class="grid gap-5">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="mb-2 block text-sm font-medium text-slate-700" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="mt-2 text-sm text-red-600">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="mt-4 flex justify-end">
                <button type="submit" class="rounded-xl bg-slate-950 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800">Finish onboarding</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
