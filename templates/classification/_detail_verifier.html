<div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="border-b border-slate-200 px-6 py-4">
    <h2 class="text-sm font-bold text-slate-900">Verifier Summary</h2>
  </div>
  <div class="space-y-4 px-6 py-5">
    <div>
      <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Warnings</div>
      <div class="mt-2 flex flex-wrap gap-2">
        {% for warning in verifier_warnings %}
        <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-800">{{ warning }}</span>
        {% empty %}
        <span class="text-sm text-slate-500">None</span>
        {% endfor %}
      </div>
    </div>
    <div>
      <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Errors</div>
      <div class="mt-2 flex flex-wrap gap-2">
        {% for error in verifier_errors %}
        <span class="rounded-full bg-rose-100 px-2 py-0.5 text-xs font-semibold text-rose-700">{{ error }}</span>
        {% empty %}
        <span class="text-sm text-slate-500">None</span>
        {% endfor %}
      </div>
    </div>
    <div>
      <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Critical Conflicts</div>
      <div class="mt-2 text-sm text-slate-700">{{ critical_conflicts|length }}</div>
    </div>
    <details>
      <summary class="cursor-pointer text-sm font-semibold text-slate-900">Open verifier JSON</summary>
      <pre class="mt-3 max-h-72 overflow-auto rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] leading-5 text-slate-700">{{ verifier_summary_json }}</pre>
    </details>
  </div>
</div>
