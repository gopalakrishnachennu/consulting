<div class="rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="border-b border-slate-200 px-6 py-4">
    <h2 class="text-sm font-bold text-slate-900">RawJob Provenance</h2>
    <p class="mt-1 text-xs text-slate-500">Current persisted provenance on the RawJob, separate from the snapshot outputs.</p>
  </div>
  <div class="space-y-4 px-6 py-5">
    <div>
      <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Classification Source</div>
      <div class="mt-1 text-sm font-semibold text-slate-900">{{ raw_job.classification_source|default:"—" }}</div>
    </div>
    <details>
      <summary class="cursor-pointer text-sm font-semibold text-slate-900">Open classification provenance</summary>
      <pre class="mt-3 max-h-72 overflow-auto rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] leading-5 text-slate-700">{{ classification_provenance_json }}</pre>
    </details>
    <details>
      <summary class="cursor-pointer text-sm font-semibold text-slate-900">Open field provenance</summary>
      <pre class="mt-3 max-h-72 overflow-auto rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] leading-5 text-slate-700">{{ field_provenance_json }}</pre>
    </details>
  </div>
</div>
