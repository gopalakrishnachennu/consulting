{% if company_warnings %}
<div class="mt-4 space-y-2">
  {% for warning in company_warnings %}
  <div class="rounded-lg border px-4 py-3 text-xs
      {% if warning.severity == 'high' %}border-red-200 bg-red-50 text-red-800
      {% elif warning.severity == 'medium' %}border-amber-200 bg-amber-50 text-amber-800
      {% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}">
    <div class="font-semibold">{{ warning.title }}</div>
    <div class="mt-0.5">{{ warning.body }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
