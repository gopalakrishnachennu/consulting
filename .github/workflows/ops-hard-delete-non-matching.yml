name: Ops - Hard-Delete Non-Matching (free space)

# Physically DELETE non-STRONG raw + vetting rows to reclaim space.
# Runs inside the live web container so ops cleanup does not rebuild the app on
# the VPS. Job-side work protection still comes from purge_non_matching_jobs.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "false = count only, true = DELETE"
        type: choice
        options: ["false", "true"]
        default: "false"
        required: true
      confirm:
        description: "Required when execute=true: type DELETE"
        default: ""
        required: false

jobs:
  hard_delete:
    runs-on: ubuntu-latest
    steps:
      - name: Count (dry-run)
        if: ${{ github.event.inputs.execute != 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/consulting
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py"
            $RUN purge_non_strong_pipeline --classify-unclassified --hard-delete

      - name: Hard delete (execute)
        if: ${{ github.event.inputs.execute == 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
              echo "Refusing: confirm must be exactly DELETE"; exit 1
            fi
            cd /opt/consulting
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py"
            $RUN purge_non_strong_pipeline --apply --classify-unclassified --hard-delete
            echo "Rows deleted. Postgres autovacuum will reclaim the disk space."
