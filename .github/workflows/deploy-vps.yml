name: Deploy to Hetzner VPS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to confirm production restart"
        required: true
      image_sha:
        description: "Optional: pin exact image SHA (e.g. sha256:abc123). Leave blank to use :main."
        required: false
        default: ""
  workflow_run:
    workflows: ["Build & publish Docker image"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ── Item 6: Guard — ensure latest CI + Docker image passed ────────────────
  preflight:
    name: "Preflight — CI + image check"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      short_sha: ${{ steps.target.outputs.short_sha }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Resolve target SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            TARGET_SHA=$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(printf '%s' "$TARGET_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Confirm DEPLOY input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Confirmation must be exactly DEPLOY"
            exit 1
          fi

      - name: Ensure target SHA is still current main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          MAIN_SHA=$(gh api repos/$REPO/commits/main --jq '.sha')
          TARGET_SHA="${{ steps.target.outputs.sha }}"
          echo "Main SHA:   $MAIN_SHA"
          echo "Target SHA: $TARGET_SHA"
          if [ "$MAIN_SHA" != "$TARGET_SHA" ]; then
            echo "❌ Refusing deploy for stale SHA. main moved after this build."
            exit 1
          fi

      - name: Wait for latest CI checks on target SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ steps.target.outputs.sha }}"
          echo "Checking CI for SHA: $SHA"

          # Use only the latest check-run result per name so old failed attempts
          # do not permanently block deploy after a successful rerun.
          for i in $(seq 1 30); do
            LATEST_CHECKS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[]
                | select(.name | startswith("Smoke") or startswith("Tests"))
                | {name, status, conclusion, completed_at}
              ]
              | sort_by(.name, .completed_at)
              | group_by(.name)
              | map(last)')
            echo "Latest CI checks: $LATEST_CHECKS"

            CHECK_COUNT=$(printf "%s" "$LATEST_CHECKS" | jq 'length')
            if [ "$CHECK_COUNT" -eq 0 ]; then
              echo "Waiting for CI checks to appear ($i/30)..."
              sleep 10
              continue
            fi

            BAD_CHECKS=$(printf "%s" "$LATEST_CHECKS" | jq -c '[.[] | select(.status != "completed" or .conclusion != "success")]')
            if [ "$BAD_CHECKS" = "[]" ]; then
              echo "✅ CI passed"
              exit 0
            fi

            PENDING_CHECKS=$(printf "%s" "$BAD_CHECKS" | jq -c '[.[] | select(.status != "completed")]')
            if [ "$PENDING_CHECKS" != "[]" ]; then
              echo "Waiting for CI checks to finish ($i/30)..."
              sleep 10
              continue
            fi

            echo "❌ Latest CI checks are not green — refusing deploy"
            echo "$BAD_CHECKS"
            exit 1
          done

          echo "❌ Timed out waiting for CI checks on $SHA"
          exit 1

      - name: Check Docker image exists for target SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ steps.target.outputs.short_sha }}"
          echo "Looking for image with SHA tag: sha-$SHA"

          # Check GHCR for image
          STATUS=$(gh api "repos/$REPO/packages/container/$(basename $REPO)/versions" \
            --jq "[.[] | .metadata.container.tags[] | select(. == \"sha-$SHA\")] | length" 2>/dev/null || echo "0")

          if [ "$STATUS" = "0" ]; then
            echo "⚠️  Could not verify image SHA tag — proceeding with :main tag"
          else
            echo "✅ Image sha-$SHA found in GHCR"
          fi

  # ── Item 7: Deploy pinned image SHA ───────────────────────────────────────
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: preflight
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image reference
        id: image
        run: |
          REPO="${{ github.repository }}"
          if [ -n "${{ github.event.inputs.image_sha }}" ]; then
            # User-specified SHA digest (for rollback)
            IMAGE="ghcr.io/${REPO}@${{ github.event.inputs.image_sha }}"
            echo "Using pinned digest: $IMAGE"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE="ghcr.io/${REPO}:sha-${{ needs.preflight.outputs.short_sha }}"
            echo "Using auto-resolved SHA tag: $IMAGE"
          else
            # Use :main tag (always latest built image)
            IMAGE="ghcr.io/${REPO}:main"
            echo "Using :main tag: $IMAGE"
          fi
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_IMAGE
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /opt/consulting
            git pull --ff-only origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pull the specific image (pinned SHA or :main)
            export IMAGE="$DEPLOY_IMAGE"
            export IMAGE_WORKER="$DEPLOY_IMAGE"
            export IMAGE_BEAT="$DEPLOY_IMAGE"
            export IMAGE_HARVEST="$DEPLOY_IMAGE"

            # Override image in compose if pinned
            if echo "$DEPLOY_IMAGE" | grep -q "@sha256:"; then
              sed -i "s|ghcr.io.*/consulting:main|$DEPLOY_IMAGE|g" docker-compose.prod.yml || true
            fi

            docker pull "$DEPLOY_IMAGE"
            docker compose -f docker-compose.prod.yml --env-file .env.production pull web celery_worker celery_harvest celery_beat 2>/dev/null || true

            export WEB_CONCURRENCY=2
            export WORKER_CONCURRENCY=2
            export HARVEST_CONCURRENCY=2

            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps web python manage.py migrate --no-input
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps web python manage.py repair_harvest_migration_state
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps -e RUN_MIGRATIONS=0 web python manage.py check

            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps web python manage.py shell -c "from harvest.models import HarvestEngineConfig; cfg=HarvestEngineConfig.get(); cfg.worker_concurrency=2; cfg.task_rate_limit=3; cfg.api_stagger_ms=1000; cfg.scraper_stagger_ms=5000; cfg.full_fetch_cooldown_minutes=360; cfg.backfill_jd_workers=1; cfg.auto_backfill_jd=False; cfg.auto_sync_to_pool=False; cfg.save(); print('Applied strict harvest uptime config')"

            RUN_MIGRATIONS=0 docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            echo "Deployed image: $DEPLOY_IMAGE" >> /opt/consulting/deploy.log
            date >> /opt/consulting/deploy.log

            # Disk hygiene: drop unused images older than 7 days + stale build cache.
            # NEVER prunes volumes. Rollback is unaffected — rollback.yml re-pulls any
            # image by SHA digest from GHCR (the registry keeps every published image).
            docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
            docker builder prune -af --filter "until=168h" >/dev/null 2>&1 || true
            df -h / | tail -1 >> /opt/consulting/deploy.log

            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 https://chennu.co/core/health/ >/dev/null 2>&1; then
                echo "✅ Production health check passed."
                exit 0
              fi
              echo "Waiting for production health check ($i/30)..."
              sleep 2
            done

            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=120 web
            echo "❌ Production deploy failed health check."
            exit 1
