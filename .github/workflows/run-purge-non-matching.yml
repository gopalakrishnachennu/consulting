name: Ops - Purge Non-Matching Jobs (selective filter)

# Keeps only selective-filter category matches in raw + pool/vetting.
# Coordinated, safe sequence:
#   1. classify the un-gated backlog
#   2. soft-archive off-category pool jobs (work-protected) + un-sync their raws
#   3. soft-deactivate off-category raw jobs
#   4. (optional) turn on pre_storage_strict_strong_only for future harvests
# Dry-run by default. Execute requires confirm = PURGE.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "false = dry-run (counts only), true = APPLY"
        type: choice
        options: ["false", "true"]
        default: "false"
        required: true
      strict:
        description: "STRONG-only (also drop POSSIBLE + UNKNOWN)?"
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true
      enable_strict_flag:
        description: "On execute, also turn ON pre_storage_strict_strong_only"
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true
      confirm:
        description: "Required when execute=true: type PURGE"
        default: ""
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run — counts only (no changes)
        if: ${{ github.event.inputs.execute != 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script_stop: true
          script: |
            set -e
            cd /opt/consulting
            git pull --ff-only origin main
            STRICT=""
            [ "${{ github.event.inputs.strict }}" = "true" ] && STRICT="--strict"
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps web python manage.py"
            echo "==== classify backlog (dry-run) ===="
            $RUN classify_existing_rawjobs --dry-run
            echo "==== pool / vetting jobs (dry-run) ===="
            $RUN purge_non_matching_jobs $STRICT
            echo "==== raw jobs (dry-run) ===="
            $RUN purge_non_matching_rawjobs $STRICT

      - name: Execute — APPLY changes
        if: ${{ github.event.inputs.execute == 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script_stop: true
          script: |
            set -e
            if [ "${{ github.event.inputs.confirm }}" != "PURGE" ]; then
              echo "Refusing: confirm must be exactly PURGE"; exit 1
            fi
            cd /opt/consulting
            git pull --ff-only origin main
            STRICT=""
            [ "${{ github.event.inputs.strict }}" = "true" ] && STRICT="--strict"
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production run --rm --no-deps web python manage.py"
            echo "==== 1) classify the un-gated backlog ===="
            $RUN classify_existing_rawjobs
            echo "==== 2) soft-archive off-category pool jobs (work-protected) ===="
            $RUN purge_non_matching_jobs $STRICT --apply
            echo "==== 3) soft-deactivate off-category raw jobs ===="
            $RUN purge_non_matching_rawjobs $STRICT --apply
            if [ "${{ github.event.inputs.enable_strict_flag }}" = "true" ]; then
              echo "==== 4) turn ON pre_storage_strict_strong_only ===="
              $RUN shell -c "from harvest.models import HarvestEngineConfig as H; c=H.get(); c.pre_storage_strict_strong_only=True; c.save(); print('strict_strong_only =', c.pre_storage_strict_strong_only)"
            fi
            echo "==== DONE ===="
