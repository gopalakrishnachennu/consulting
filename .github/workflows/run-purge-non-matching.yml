name: Ops - Enforce Strong-Only Pipeline Cleanup

# Enforces CHENN's STRONG-only intake policy across raw + vetting using the
# consolidated management command. Runs directly inside the live web container
# so ops cleanup does not rebuild the application on the VPS.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "false = dry-run (counts only), true = APPLY"
        type: choice
        options: ["false", "true"]
        default: "false"
        required: true
      strict:
        description: "STRONG-only (also drop POSSIBLE + UNKNOWN)?"
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true
      enable_strict_flag:
        description: "On execute, also turn ON pre_storage_strict_strong_only"
        type: choice
        options: ["true", "false"]
        default: "true"
        required: true
      confirm:
        description: "Required when execute=true: type PURGE"
        default: ""
        required: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Dry-run — counts only (no changes)
        if: ${{ github.event.inputs.execute != 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd /opt/consulting
            git pull --ff-only origin main
            if [ "${{ github.event.inputs.strict }}" != "true" ]; then
              echo "Refusing: this workflow is now STRONG-only by design."
              exit 1
            fi
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py"
            CMD="purge_non_strong_pipeline --classify-unclassified"
            if [ "${{ github.event.inputs.enable_strict_flag }}" = "true" ]; then
              CMD="$CMD --enable-strict-flag"
            fi
            $RUN $CMD

      - name: Execute — APPLY changes
        if: ${{ github.event.inputs.execute == 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            if [ "${{ github.event.inputs.confirm }}" != "PURGE" ]; then
              echo "Refusing: confirm must be exactly PURGE"; exit 1
            fi
            cd /opt/consulting
            git pull --ff-only origin main
            if [ "${{ github.event.inputs.strict }}" != "true" ]; then
              echo "Refusing: this workflow is now STRONG-only by design."
              exit 1
            fi
            RUN="docker compose -f docker-compose.prod.yml --env-file .env.production exec -T web python manage.py"
            CMD="purge_non_strong_pipeline --apply --classify-unclassified"
            if [ "${{ github.event.inputs.enable_strict_flag }}" = "true" ]; then
              CMD="$CMD --enable-strict-flag"
            fi
            $RUN $CMD
